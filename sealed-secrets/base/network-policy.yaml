# Selects only the controller; the rest of kube-system is left to k3s.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sealed-secrets-controller
spec:
  podSelector:
    matchLabels:
      name: sealed-secrets-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Certificate and rotation endpoints, reached through the API server's service proxy (kubeseal)
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - port: 8080
  egress:
    # DNS
    - to:
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server (k3s serves it on the node's port 6443)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - port: 6443
