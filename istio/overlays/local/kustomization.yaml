apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../network-policies
  - settings.yaml

replacements:
  - source:
      kind: ConfigMap
      name: istio-settings
      fieldPath: data.domain
    targets:
      - select:
          kind: Gateway
          name: gateway
        fieldPaths:
          - spec.listeners.[name=https].hostname
        options:
          delimiter: '.'
          index: 1
      - select:
          kind: HTTPRoute
          name: http-to-https-redirect
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
      - select:
          kind: HTTPRoute
          name: http-to-https-redirect
        fieldPaths:
          - spec.hostnames.1
  - source:
      kind: ConfigMap
      name: istio-settings
      fieldPath: data.tlsSecretName
    targets:
      - select:
          kind: Gateway
          name: gateway
        fieldPaths:
          - spec.listeners.[name=https].tls.certificateRefs.0.name

